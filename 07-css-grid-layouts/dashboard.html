<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="dashboard-layout">
    <header class="dashboard-header">
      <h1>Study Dashboard</h1>
    </header>

    <aside class="dashboard-sidebar">
      <h2>Navigation</h2>
      <nav>
        <a href="#overview">Overview</a>
        <a href="#tasks">Tasks</a>
        <a href="#schedule">Schedule</a>
      </nav>
    </aside>

    <main class="dashboard-main" id="overview">
      <h2>Welcome, Mohit</h2>
      <p>Use this space to keep your learning organized.</p>

      <section id="tasks">
        <h3>Today’s tasks</h3>
        <p>Review HTML notes and practice CSS Grid.</p>
      </section>

      <section id="schedule">
        <h3>Next study session</h3>
        <p>Continue working on the CSS assignments.</p>
      </section>
    </main>

    <footer class="dashboard-footer">
      <p>Study Dashboard · 2026</p>
    </footer>
  </div>
</body>
</html>
