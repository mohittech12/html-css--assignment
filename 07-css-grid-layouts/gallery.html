<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nature Photo Gallery</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Nature Photo Gallery</h1>
    <p>A collection of landscapes and outdoor scenes.</p>

    <section class="photo-grid" aria-label="Nature photographs">
      <figure>
        <img src="https://images.unsplash.com/photo-1470252649378-9c29740c9fa8?auto=format&fit=crop&w=900&q=80" alt="Sunrise over a green landscape">
        <figcaption>Morning light</figcaption>
      </figure>
      <figure>
        <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80" alt="Mountain landscape beneath a wide sky">
        <figcaption>Open country</figcaption>
      </figure>
      <figure>
        <img src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=900&q=80" alt="Mountain reflected in a calm lake">
        <figcaption>Still water</figcaption>
      </figure>
      <figure>
        <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=900&q=80" alt="Sunlight filtering through a forest">
        <figcaption>Forest path</figcaption>
      </figure>
      <figure>
        <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=900&q=80" alt="Mountain range beside a blue lake">
        <figcaption>Mountain lake</figcaption>
      </figure>
      <figure>
        <img src="https://images.unsplash.com/photo-1518837695005-2083093ee35b?auto=format&fit=crop&w=900&q=80" alt="Ocean waves reaching the shore">
        <figcaption>Ocean waves</figcaption>
      </figure>
      <figure>
        <img src="https://images.unsplash.com/photo-1472214103451-9374bd1c798e?auto=format&fit=crop&w=900&q=80" alt="Green hills under a cloudy sky">
        <figcaption>Green hills</figcaption>
      </figure>
      <figure>
        <img src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=900&q=80" alt="A scenic view of nature and distant hills">
        <figcaption>Wide horizon</figcaption>
      </figure>
      <figure>
        <img src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e?auto=format&fit=crop&w=900&q=80" alt="Blue sea beside a sandy beach">
        <figcaption>Blue coast</figcaption>
      </figure>
    </section>
  </main>
</body>
</html>
